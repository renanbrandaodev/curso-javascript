<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        body {
            font-size: 2em;

        }
    </style>
</head>
<body>
    
    <script>
        var nome = prompt('Qual seu nome? ')
        document.writeln(`Olá ${nome}! Seu nome tem ${nome.length} letras.<br>`)
        document.writeln(` Seu nome em letras maiúsculas é ${nome.toUpperCase()}<br>`)
        document.write(`Seu nome em minúsculas é ${nome.toLowerCase()}`)
    </script>
    
</body>
</html>
