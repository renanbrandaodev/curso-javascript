<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        #area {
            font-size: 1.5em;
            background-color: green;
            color: white;
            width: 200px;
            height:200px;
            line-height:200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="area">
        Interaja...
    </div>
    
    <script>
        let area = document.getElementById('area');
        area.addEventListener('click', clicar);
        area.addEventListener('mouseenter', entrar)
        area.addEventListener('mouseout', sair);
        
        function clicar () {
            area.innerHTML = 'Clicou!';
            area.style.background = 'blue';
            area.style.border = '2px solid black';
            area.style.color = 'yellow';

        }

        function entrar () {
            area.innerHTML = 'Entrou!';
            area.style.border = '2px solid red';
            area.style.background = 'black';
        }

        function sair () {
            area.innerHTML = 'Saiu!';
            area.style.background = 'yellow';
            area.style.color = 'blue';
            area.style.border = '2px solid blue';
        }
    </script>
</body>
</html>
