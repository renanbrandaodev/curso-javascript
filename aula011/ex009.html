<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasileiro ou Estrangeiro?</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: linear-gradient(45deg , yellow, purple, red);
            background-repeat: no-repeat;
            height: 100vh;
        }
        #container {
            font-size: 1.5em;
            text-align: center;
            background-color: white;
            box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.400);
            border-radius: 30px;
            width: 50vw;
            margin: auto;
            padding: 25px;
            position: relative;
            top: 50px;

        }
        #bt {
            border-radius: 25px;
            font-weight: bold;
            color: white;
            background-color: rgba(128, 0, 128, 0.63);
            padding: 8px;
        }
        #pais {
            border-radius: 25px;
            padding: 8px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>Brasileiro ou Estrangeiro?</h1>
        <p>Qual país você nasceu?</p>
        <input type="text" name="pais" id="pais" placeholder="País">
        <input type="button" value="Clique para checar" id="bt">
        <div id="res">
        </div>
    </div>



    <script>
        let bt = document.getElementById('bt')
        let pais = document.getElementById('pais')
        let res = document.getElementById('res')
        bt.addEventListener("click", checar)

        function checar() {
            res.innerHTML = `Você nasceu em ${pais.value}.`
            if (pais.value.toLowerCase() === "brasil")  {
                res.innerHTML += `<p>Você é Brasileiro!</p>`
            } else {
                res.innerHTML += `<p>Você é estrangeiro!</p>`
            }
        }
    
        
    
    </script>
</body>
</html>
