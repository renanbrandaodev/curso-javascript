<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
</head>
<body>
    <h1>Sistema de multas</h1>
    Velocidade do veículo:<input type="number" name="vel" id="vel">Km
    <input type="button" value="Verificar" id="bt">
    <div id="res">

    </div>

    
    <script>
        const bt = document.getElementById('bt')
        bt.addEventListener("click", calcular)

        function calcular() {
            let txtvel = document.getElementById('vel')
            let res = document.querySelector('div#res')
            let vel = Number(txtvel.value)
            res.innerHTML = `<p>Sua velocidade atual é de <strong>${vel}Km/h</strong>.</p>`
            if (vel > 60) {
                res.innerHTML += `Você foi <strong>multado</strong> por excesso de velocidade!</p>`
            }
            res.innerHTML += `<p>Dirija sempre com cinto de segurança!</p>`

        }
    </script>

</body>
</html>
