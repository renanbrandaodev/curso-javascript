<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de idade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Verificador de idade</h1>
    </header>
    <section>
            <div id="anoNasc">
                <p>Ano de nascimento: 
                <input type="number" name="ano" id="anoN" min="0"></p>
            </div>

            <div id="sexo">
                <p>Sexo: 
                    <input type="radio" name="opcao" value="sexomasc" id="masc"checked><label for="masc">Masculino</label>
                    <input type="radio" name="opcao" value="sexofem" id="fem"><label for="fem">Feminino</label>
                </p>
            </div>
            
            <div id="botao">
                <button id="bt" onclick="verificar()">Verificar</button>
            </div>

            <div id="res">
                Preencha os dados acima para ver o resultado!
            </div>

    </section>

    <footer>
        <p>Criado por Renan Brandão para o CursoemVideo</p>
    </footer>
    

    <script src="script.js"></script>
</body>
</html>
