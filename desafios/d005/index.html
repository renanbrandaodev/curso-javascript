<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.5em;
        }
        #container {
            text-align: center;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.300);
            padding: 20px;
        }
        #bt {
            padding: 20px;
        }

    </style>
</head>
<body>
    <div id="container">
        <h1>Conversor de Medidas</h1>
        <button id="bt">Converter</button>
        <div id="res">
            <p>Clique no botão acima para iniciar a conversão.</p>
        </div>
    </div>
    

   <script>
    let bt = document.getElementById('bt')
bt.addEventListener("click", converter)

function converter() {
    let distancia = Number(prompt("Digite uma distância em metros(m): "))
    let res = document.querySelector('p')

    let opcoes = { minimumFractionDigits: 3, maximumFractionDigits: 3 }

    res.innerHTML = `<p>A distância de ${distancia} metros corresponde a:</p>`
    res.innerHTML += `<p>${(distancia / 1000).toLocaleString('pt-BR', opcoes)} quilômetros (km)</p>`
    res.innerHTML += `<p>${(distancia / 100).toLocaleString('pt-BR', opcoes)} hectômetros (hm)</p>`
    res.innerHTML += `<p>${(distancia / 10).toLocaleString('pt-BR', opcoes)} decâmetros (dam)</p>`
    res.innerHTML += `<p>${(distancia * 10).toLocaleString('pt-BR', opcoes)} decímetros (dm)</p>`
    res.innerHTML += `<p>${(distancia * 100).toLocaleString('pt-BR', opcoes)} centímetros (cm)</p>`
    res.innerHTML += `<p>${(distancia * 1000).toLocaleString('pt-BR', opcoes)} milímetros (mm)</p>`
}
   </script>
</body>
</html>
