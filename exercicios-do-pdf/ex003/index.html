<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados em JS</title>
    <style>
        body {
            font-size: 2em;
        }
        button {
            font-size: 2em;
            padding: 30px;
        }
    </style>
</head>
<body>
    <h1>Trabalhando com dados</h1>
    <button onclick="inicio()">Clica em mim para começar</button>

    <script>
        function inicio() {
            let nome = prompt('Qual é seu nome? ')
            alert(`Olá ${nome}, é um prazer te conhecer!`)
        }
    </script>
</body>
</html>
