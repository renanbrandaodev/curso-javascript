<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 006</title>
    <style> 
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 1.5em;
        }

        #container {
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.300);
            border-radius: 10px;
            text-align: center;
            margin: auto;
            padding: 15px;
        }

        #bt {
            padding: 20px;
        }

        #res {
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>Somando dois números</h1>
        <button id="bt">Iniciar a soma</button>
        <div id="res">
            <p>O resultado aparece aqui...</p>
        </div>
    </div>

    <script>
        let bt = document.getElementById('bt')
        bt.addEventListener("click", clicar)
        function clicar() {
            let n1 = Number(prompt(`Digite um número: `))
            let n2 = Number(prompt(`Digite outro número: `))
            let soma = n1 + n2;
            let res = document.querySelector('div#res')
            res.innerHTML = `A soma entre ${n1} e ${n2} é ${soma}.`
        }
    </script>
    
</body>
</html>
